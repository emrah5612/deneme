name: Daily Jail Roster Scraper

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Yazma izinlerini iş akışına açıkça tanımlıyoruz:
permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Gerekli Paketleri Yukle
        run: |
          pip install requests urllib3

      - name: Scraper'i Calistir
        run: |
          python main.py

      - name: Guncellenen JSON Verilerini Git'e Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update jail roster data" && git push)
